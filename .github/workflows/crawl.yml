# 巡回：GitHub のサーバーから印刷所サイトを巡回する（仕様書61章）
# どの実行でも develop を巡回し、結果（state.yaml と meta.json）を artifact に置く。手元で npm run crawl:import で取り込む
# リポジトリには書き込まない。本文はログにも artifact にも出さない（7-2）
# 週1回の定期実行は、手動実行で確かめてから別の変更で加える（61-5）
name: Crawl

on:
  workflow_dispatch:
    inputs:
      printer:
        description: '印刷所ID（空なら crawl_policy が allowed の全社）'
        required: false
        type: string
      max_urls:
        description: '1社あたりの取得数（空なら20。印刷所の指定とあわせて、少数で試すとき用）'
        required: false
        type: string

permissions:
  contents: read

# グループ名にブランチを含めない：main と develop の実行も同時に動かさない（後から来た実行は待つ）
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 巡回
        env:
          PRINTER: ${{ inputs.printer }}
          MAX_URLS: ${{ inputs.max_urls }}
        run: |
          export BASE_COMMIT="$(git rev-parse HEAD)"
          args=(--out=crawl-result)
          if [ -n "$PRINTER" ]; then args+=(--printer="$PRINTER"); fi
          if [ -n "$MAX_URLS" ]; then args+=(--max-urls="$MAX_URLS"); fi
          npm run crawl -- "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: crawl-result
          path: crawl-result/
          retention-days: 14
          if-no-files-found: error
