# 巡回（手動実行のみ）：GitHub のサーバーから印刷所サイトを取得できるかの確認用（phase3-design 11章）
# 結果はジョブの概要欄に出す。state.yaml は書き換えず、本文はログにも出さない（7-2）
# 週1回の定期実行は Phase 5 でレポートPRと一緒に入れる
name: Crawl

on:
  workflow_dispatch:
    inputs:
      printer:
        description: '印刷所ID（空なら crawl_policy が allowed の全社）'
        required: false
        type: string
      max_urls:
        description: '1社あたりの取得数（空なら20。印刷所の指定とあわせて、少数で試すとき用）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 巡回
        env:
          PRINTER: ${{ inputs.printer }}
          MAX_URLS: ${{ inputs.max_urls }}
        run: |
          args=()
          if [ -n "$PRINTER" ]; then args+=(--printer="$PRINTER"); fi
          if [ -n "$MAX_URLS" ]; then args+=(--max-urls="$MAX_URLS"); fi
          npm run crawl -- "${args[@]}"
