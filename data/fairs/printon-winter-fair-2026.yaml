conditions_text: 新規・再版どちらも利用可。急行・特急・超特急の本セット、表紙のみ印刷、グッズ全般は対象外。自己申告制で、入稿完了後の申請は不可。同じサービスオプションの重複は不可。最大割引率25%・最大割引額30,000円まで。支援イベントと併用する場合は支援イベント名を記入。選んだオプション・特殊加工の納期が加算される。有料オプション・特殊加工の20%割引は一番高いものに適用（わくわくドキドキシリーズは対象外）。
