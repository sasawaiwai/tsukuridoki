conditions_text: 割増〆切では利用不可（通常〆切までに入稿）。特殊紙表紙（無料：エスプリVNエンボス・ベィビーフェイスN・ヴァンヌーボVG-FS、半額：里紙・OKフロート）はゆうゆうセットが対象で、特殊紙にPP加工はできない。表紙5色刷り（半額）はゆうゆうセット・パンダフルセットで、表紙の紙はスーパーポスト、PPはクリア・マットのみ。TCシリーズはオンデマンド表紙カラー・オールカラーセットが対象で、〆切が早まる。併用できる割引はフェアごとに異なる。原稿用紙プレゼントは1人1冊。
