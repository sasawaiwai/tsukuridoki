conditions_text: ホワイトポストの表紙のみ。PPは薄い白色のため、濃い色の絵柄は色の差が見えにくくなる。トムソン加工・セパレーション加工とは併用不可、箔押しは繊維の凹凸の影響を受ける場合あり。料金は申し込み後にスタッフが案内。締切は各セットの表紙の締切日。備考欄に「和紙PPフェア希望」とPPの種類を記入。申し込みがないと利用不可、前入金制、特急入稿は不可。
