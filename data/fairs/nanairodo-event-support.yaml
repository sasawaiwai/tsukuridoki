conditions_text: 協賛登録イベントに参加し、そこで頒布する新刊・既刊の再版が対象（イベントの一覧は公式で確認）。フルカラー・本文単色カラー・スタンダード・モノクロの各パックが対象。ポストカードはアートポスト180kg、裏はモノクロの郵便枠。自己申告制で、注文時に特典を選び備考にイベント名を書く。無料ポストカード12枚サービスと併用不可。1イベント1作品につき1回。原則イベント前の注文が対象。
