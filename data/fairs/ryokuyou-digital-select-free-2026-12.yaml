conditions_text: 冊子1種につき1つ。対象会場は東京ビッグサイト・インテックス大阪。対象はデジタルオールカラーセット・デジタル小説本セット・デジタルミックスセット・デジタルブラックセット（デジタルブラックセットは+2冊のみ）。+2冊は冊子の〆切どおりで、増量分は1か所に一括納品。スターリーカラー（シルバー系10色）・プレシャスカラーはB5以下・ハイマッキンレーポスト（クリアPPまたはマットPP）表紙限定で、フェア〆切はイベントごと（例：12/20合わせ12/3(木)正午、1/10合わせ12/24(木)正午。プレシャスカラーの12/13合わせはCOMITIA特別バックアップページで確認）。自己申告制（予約時に申請）。
