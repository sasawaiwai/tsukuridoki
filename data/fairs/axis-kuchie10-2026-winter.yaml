conditions_text: |-
  「DOZEN ROSE FES 2026」か「コミックマーケット109」に参加する人が対象。
  同人誌ご予約フォームからの予約（フェア最終日の1営業日前まで）でフェアにチェックし、入稿時に注文書にも書く。
  セット商品の表紙＋本文印刷が対象（豆本セット・折りとじ本セット・中とじのセットは不可）。
  表紙と同時入稿。
  口絵はオフセットの片面フルカラー・コート紙110kg（裏面印刷は1冊10円加算）。
  納期の加算なし。
  本文の途中に差し込む場合は差し込み料が別途かかる。
  付け合わせの状況によりデジタルオフセット印刷になる場合あり。
