conditions_text: |-
  支援イベント（一覧は公式で確認）に参加するサークルが対象。
  オンデマンドセット・二色カラー本セット・コピー本セットなどのセット料金が5%割引（割引・割増の段階が1つずつ良くなり、最大割引は20%。もともと20%割引のときは割引なし）。
  直接搬入料・宅配搬入料・自宅などへの配送料が1か所まで無料（沖縄を除く）。
  発注書に支援イベント名を書く（書いていないと割引にならない）。
  自宅配送・店頭引取でも利用可。
  申込はイベント開催の2週間前まで。
