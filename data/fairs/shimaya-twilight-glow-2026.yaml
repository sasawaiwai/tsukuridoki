conditions_text: オンデ表紙セット・特殊紙フルカラーセット オンデマンドver・文芸オンデセット・十人十色セットなど、オンデマンド表紙の対象セットのみ（各プレミアムも対象）。表紙はオンデマンドフルカラー（ピュアホワイトの白おさえ付きも可）。ハイピンクなどの特色印刷、表2・3印刷は併用不可。クリアPP加工が必須（マットPPへの変更は別料金）。料金は部数・仕様により異なる（公式の料金表で確認）。締切は表紙の締切の7営業日前、特急入稿は不可。注文時に表紙オプションで「トワイライトグロウフェア」を選択。前入金制、表紙のみの納品は不可。在庫がなくなり次第終了。
