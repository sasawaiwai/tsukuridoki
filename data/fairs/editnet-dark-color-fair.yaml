conditions_text: オンデマンドお試しプランの特別割引として提供。表紙は指定の濃色紙（里紙〈あやめ・くり・こん・すみ〉・ディープマット〈インディゴ・ルージュ〉・ミランダ〈くろ〉）にオンデマンド白1色、本文はオンデマンド黒1色（2色印刷への変更は別料金）。無線綴じのみ。A5・B5（文庫・新書まで小さいサイズも可）。白の面積が全体の50%を超える場合は加算額が必要になることがある。白印刷が関係するためWebの入稿手続き（e窓）は使えず、印刷依頼書で申し込む。入稿期限はイベント前週の木曜20時（前々週なら割引あり。大きなイベントの前などは異なる）で、期限後はこのフェアを扱わない。ページに記載のない割引は対象外。料金は公式で確認。
