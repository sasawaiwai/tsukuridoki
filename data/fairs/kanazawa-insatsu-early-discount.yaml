conditions_text: 前金セット商品が対象（早割30・25・20はスタンダードオフセットなど7〜8種、早割15は6種、早割10は表オフ本オンデセット・オンデセットの2種）。他のフェアと併用不可。締切は宅配便・郵便が必着、オンライン入稿が15時まで。発送日はイベント合わせで、納品日の指定・早期納品は不可（早めに自宅で受け取りたい場合や宅配搬入の場合は、前週のフェアを使うよう案内あり）。早割15・10はアナログ原稿の対象外。申し込み時に早割の指定が必要（オンライン入稿は見積りで「利用する」にチェック、郵送は注文書の備考欄に記入）。
