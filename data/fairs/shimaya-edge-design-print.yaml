conditions_text: 対象セットのみ（ビデオテープ・DVDケース入りブックも対象）。背幅6mm以上の本（本文用紙ごとのページ数の目安あり）。3面印刷は文庫・新書・B6・DVDブックのみ（A5は1面のみ）。絵柄はランダムに印刷され、1冊ずつ位置が違う。PP加工を推奨。箔押し・角丸・スピン紐・中綴じなどとは併用不可。自分のデザインでの印刷は別に見積り。料金はページ数・面数・部数により異なる（公式の料金表で確認）。備考欄に希望のデザイン名を記入。前入金制、特急入稿は不可。
