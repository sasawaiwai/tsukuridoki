conditions_text: 文学フリマに搬入がある人のみ（ほかのイベントは不可）。対象は文芸ベーシックセット・文芸カラー表紙セット・文芸カラーカバーセット・文芸オンデセット・文芸オンデカラーカバーセット（文芸ステープル・ラノベセットは対象外）。文学フリマ合わせの早割10%OFFの締切までに入稿（オプションの締切が早い場合はそちらに従う）。納品日の指定は不可。発注書・備考欄に「文学フリマフェア 1冊発送サービス希望」と記入（記入がないと利用不可）。申し込み後の変更は不可。
