conditions_text: 表紙用紙はNPホワイト200kg。刷り方は通常（St-4）・蛍光ピンク50%（Comic-4）・蛍光ピンク差し替えから選択。本文はオフセットスミ刷りで、上質紙・ハイバルギー・美弾紙・淡クリームキンマリなどから選択。印刷サンプルはオンラインショップで販売。早期入稿で10%オフ。早期入稿の割引は料金表と有料オプションが対象で、追加オプションの料金は対象外。240ページ以上は締切が3営業日早まる。
