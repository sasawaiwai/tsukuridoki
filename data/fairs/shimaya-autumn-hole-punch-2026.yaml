conditions_text: スタンダードセット・オンデ表紙セット・文芸オンデセットなど対象セットのみ（各プレミアムも対象）。B5・A5・文庫、無線綴じのみ。丸・三日月は穴の位置が固定（移動は相談・見積り）。レーザー加工のため焦げ・変色が出る場合あり、位置が数mmずれる場合あり。料金は部数・仕様により異なる（公式の料金表で確認）。締切は各セットの表紙の締切の4営業日前。カバーや対象外のサイズへの加工は事前に見積り。申し込みがないと利用不可、前入金制、特急入稿は不可。
