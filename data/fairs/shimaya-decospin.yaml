summary: 本に付けるスピン紐（しおり紐）に、特殊紙をレーザーカットしたチャームを付けられるオプション。紐の色は14色、チャームのデザインは30種類から選べる。
benefit_summary: しおり紐に特殊紙のチャームを付けられる
source_type: official_fair
sizes:
  - A5
  - B6
  - shinsho
  - bunko
