  - perfect
specific_sets_only: true
application_required: true
conditions_text: 無線綴じの本のみで、文芸オンデセット・スタンダードセット・ベーシックセットなど対象セットのみ。チャームの用紙・印刷色は一覧から選ぶか、しまやおまかせ（希望は不可）。チャームは紐に付けずに納品（自分で取り付け）。料金（セット料金に追加）：10部3,350円〜。締切は対象セットの締切の10営業日前、特急入稿は不可。注文時に表紙オプションで選び、備考欄に注文内容を記入（申し込みがないと利用不可）。前入金制。小口染め・トムソン加工・セパレーション加工などとは併用不可。
