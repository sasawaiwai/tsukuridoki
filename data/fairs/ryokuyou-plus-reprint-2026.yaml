conditions_text: 1年以内に印刷された本の再版が対象。スタンダードコースはセット価格、カスタムコースは本文料金から15%OFF（上限金額40万円）。デジタルコースは対象外。他社で印刷した本は、初版の仕様がわかる注文メールの控えなどを同梱し、奥付に緑陽社の社名を書く。緑陽社で印刷した本は、奥付＋本文4ページまで差し替え可（手数料無料。5ページ以上は対象外）。自己申告制で、自動見積の「その他割引・加算」欄に「再版割プラス利用」「-15」「%」と入力。通常の締切まで利用可。
