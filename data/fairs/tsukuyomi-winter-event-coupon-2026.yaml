conditions_text: オンデマンドセットで、対象イベントへの「イベント直接搬入」を申し込み、初回納品日をイベント開催日と同日にする。日割30以上で3,000円、40以上で4,000円、50以上で5,000円、60以上で6,000円のクーポン（条件の最も高い1枚、1発注につき1枚）。発送準備完了の時点でカウントし、TM:Iのミッション一覧から受け取る。クーポンの有効期限は2027/6/30。初回納品日が対象イベントより前で、他イベント・宅配便の納品先へ分納する場合は対象外。日割の条件があるため、申し込める最終日はイベント日より前になる（公式に日数の記載なし）。
