conditions_text: オンデ表紙セット・オンデマンドセット 極匠・文芸オンデセットなど対象セットのみ（各プレミアムも対象。文芸カラーカバーセットなどは表紙のみ）。表紙印刷は対象セットに準じる（オンデマンドフルカラー・スミ・単色）。紙の風合いを生かすため表紙にPP加工は付かない。ファンタスは印刷面（色の面か白い面か）を備考欄に記入。料金は部数・仕様により異なる（公式の料金表で確認）。締切は各セットの表紙の締切まで。紙の在庫により受付終了の可能性あり。申し込みがないと利用不可、前入金制、特急入稿は不可。
