conditions_text: イベント開催日の60日前から利用可。注文フォームSTEP01の「イベント支援特典」で参加イベントと特典を選ぶ。特典は1点：冊子印刷セット料金5%OFF／グッズ印刷料金5%OFF／会場搬入料金の割引（宅配搬入無料・直接搬入半額、会場搬入のときのみ）／表紙紙替え（特殊紙A）無料。WEBイベントは搬入以外を利用可。早入稿特典・ポイントと併用可、フェア・クーポンとは併用できない場合がある。一部商品・表紙だけ印刷は不可。
