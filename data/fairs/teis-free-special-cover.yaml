conditions_text: 対象はベーシック冊子印刷・オールフルカラー冊子印刷の表紙用紙のみ。無料の対象は時期により、きらきら・パール（現在の対象）、エンボス・特殊用紙、和風に変わる。用紙の銘柄・色は指定できない（原則白色ベース）。+1営業日（締切が1営業日早まる）。カートでコート180kgを選び、オプションで「特殊紙表紙」→「【数量限定】無料特殊紙」を選ぶ。予告なく早期終了・内容変更の可能性あり。キャンペーンコードでの割引・特典は1注文につき1つのみ（クーポンコードは公式で確認）。
