conditions_text: 対象は新書判・文庫判のオプション・カバー。納品希望日の2週間前までの入稿が条件（直接搬入イベントは告知の締切からさらに1週間前が目安、宅配搬入は必着日から2週間前）。使えるPP：トワイライト・ベルベット・ホロ（さくら・花吹雪・スター・新スターライト・ハート）・和紙（雲竜）・ラメ。トワイライト・ホロ・和紙・ラメは背幅20mmまで。ベルベットPPは折り返しに濃い色があると浮くことがある。
