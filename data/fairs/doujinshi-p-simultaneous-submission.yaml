conditions_text: 完全予約制（メールで予約してから注文）。2種類を同じ部数で同時入稿（同時入稿は2件まで）。表紙はアートボード180kg、本文は2種類とも同じ用紙（上質紙90kg・オペラホワイトマックス73kg・OKブライト90kg・ニューシフォンクリーム60kgから）。PP加工可。2人で使うときは、相手の注文の備考欄に名前・メールアドレスと利用希望を書く。2件の入稿と入金の完了で受付確定。併用できるのは早割りAコース（15%OFFに）・Bコース（20%OFFに）と、早割りでのリピート印刷だけ。
