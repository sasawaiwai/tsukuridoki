conditions_text: 対象はオフセット印刷「エコエコワン早期特典」の表紙。使える特色は銀・金（青口・赤口）・蛍光（ピンク・オレンジ・イエロー・グリーン・レッド）・白・白（不透明）・群青の11色。3色以上は、3色目から基本色としてのインキ加算額と多色刷り加算額がかかる。本文に特色を使う場合は通常どおりの計算。部数やページ数によっては、通常のプランに加算額を足したほうが安くなる場合がある。料金は公式で確認。
