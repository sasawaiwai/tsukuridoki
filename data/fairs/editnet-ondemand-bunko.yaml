conditions_text: 文庫判（105×148mm）・無線綴じのみ。ページ数はおおむね300ページまで、部数は500部まで（超える場合は問い合わせ）。本文はオンデマンド黒1色（淡いクリームのソリストNか淡いピンクのソリストSP）、表紙はオンデマンドのフルカラーか白1色。表紙用紙はこのフェアの指定のもの（里紙・ファーストヴィンテージ・ディープマット）だけ。横綴じ本とは併用できない。ページに記載のない割引は対象外。料金は公式で確認。
