conditions_text: ねこのしっぽで初版を印刷していること。表紙の原稿に変更がなく、本文の変更は奥付のみ。入稿時に納品先がすべて決まっていること（預かりが発生すると対象外）。入稿後の部数・納品先の変更は不可。通常〆切日までの申込で10%、早期入稿なら早割と併用で最大20%（上限20%）。特急入稿は対象外。他のキャンペーンと併用不可。割引はぱっくの基本料金のみでオプションは対象外。対象は常設の同人誌ぱっく全て（初版が期間限定・取扱い終了のぱっくは通常ぱっくへの仕様変更で可）。自己申告制（申込方法は公式で確認）。
