conditions_text: 2026/12/1〜12/31に納品する新刊冊子が対象。対象書店はとらのあな・メロンブックス・フロマージュ（ケイヒン配送内のフロマージュ宛に納品するコミコミスタジオも対象）。緑陽社から書店への直接納品に限る（お客様宅経由は対象外）。発注時に納品指示とフェアの申請が必要で、本文入稿時までに納品先・納品数が確定し、その後変更がないこと。バックアップイベントならさらに1か所無料。自己申告制（自動見積で「納品代無料」にチェック、発注書は備考欄）。
