conditions_text: 入稿締切：Sコース2026/12/2・Aコース12/9・Bコース12/16・Cコース12/23（各午前10時）。冊子印刷（表紙だけ印刷を除く）の基本料金が5000円以上（オプション・送料を除く）。早入稿特典・イベント支援特典・その他のフェア・クーポンとは併用不可（ポイントは可）。注文フォームの「各種フェア適用」で選ぶ。締切が早いコースほど選べる特典が多い（S・Aは3点、Bは2点、Cは印刷料金5%OFFか直接搬入料金半額）。特典はセット料金の割引（S15%・A10%・B5%・C5%）、直接搬入料金の割引（納品期間中の直接搬入イベントのみ）、表紙紙替え・表紙2.3印刷・箔押し・本文紙替え・遊び紙・角丸・特殊断裁・余部別送などのオプションの無料・割引、早入稿グッズから2点無料（Bは不可）。対象セット・オプションはコースごとに違うので公式で確認。Cコースは6営業日以上の冊子は対象外。表紙だけ印刷は印刷料金5%OFF＋直接搬入料金半額のフェアが別にある。フルカラー口絵2P無料もある（Bは不可）。
