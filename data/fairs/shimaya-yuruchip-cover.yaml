conditions_text: オンデマンドセット 極匠・文芸オンデセットなど対象セットのみ（文芸カラーカバーセット・ラノベセットは表紙のみ）。無線綴じのみ。紙の風合いを生かすため表紙にPP加工は付かない。白おさえはオプション（セミオーダーは白おさえなし）。ボール紙素材のため背割れ・トナーの割れが出る場合あり。料金は印刷方法・部数により異なる（公式の料金表で確認）。締切は表紙・本文とも通常の締切の2営業日前。備考欄に紙の色と印刷色を記入。表紙のみの納品は不可。申し込みがないと利用不可、前入金制、特急入稿は不可。公式の特殊紙表紙一覧では「常設フェア」に分類されているが、フェアページには「在庫終了次第」と終了条件がある。
