conditions_text: スタンダードセット・文芸オンデセットなど対象セットのみ（各プレミアムも対象）。遊び紙はモフル・レザック16・ミランダなど6種から選び、前のみ。印刷はネオンピンク・ピュアホワイト・シャインゴールドから1色（印刷なしも可）。セミオーダーデザインの利用は無料（備考欄で申し込み）。料金は用紙・印刷色・部数により異なる（公式の料金表で確認）。締切は各セットの本文の締切。遊び紙のみの納品は不可。申し込みがないと利用不可、前入金制、特急入稿は不可。
