conditions_text: |-
  対象の冊子を1部だけ注文した場合に限る（ネコポスでポスト投函、納品先は注文者の住所のみ）。
  納品期間は1/23〜1/25・1/30〜2/1・2/6〜2/8の3回で、締切は無線綴じ・中綴じが1/14・1/21・1/28（各午前10時）、中ミシン綴じは営業日数によりそれより早い（公式の表で確認）。
  注文フォームの「各種フェア適用」で選ぶ。
  早入稿特典・イベント支援特典・その他のフェア・クーポンとは併用不可（ポイントは可）。
  対象セットは公式の一覧で確認。
