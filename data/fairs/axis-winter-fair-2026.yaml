conditions_text: 同人誌ご予約フォームから予約し（フェア最終日の1営業日前まで）、入稿時に同人誌注文書に記載する。セット商品の「表紙＋本文」印刷が対象（豆本・折りとじ本セットを除く）。表紙だけの印刷になったときは通常料金。オプション1（箔押し〔金・銀〕・エンボス・デボス、表紙1か4に1か所・50cm²まで）は1つだけ、表紙・カバーのみ。オプション2（表紙2-3印刷〔シアンのみ〕・マットPPに変更・角丸・色上質紙の遊び紙〔前〕・変型断裁・表紙1カット製本）は複数可。加工ごとに納期が加算（表紙納期＋2〜5営業日）。5000部まで。オータム・スプリングフェアと併用不可。
