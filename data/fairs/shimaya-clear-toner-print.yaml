conditions_text: オンデ表紙セット・オンデマンドセット 極匠・文芸オンデセットなど対象セットのみ（各プレミアム、ビデオテープ・DVDケース入りも対象）。表紙用紙はホワイトポスト200kg白のみ、マットPPが付く（ほかのPPとは併用不可）。デザイン透明プリントの利用は無料（備考欄で申し込み）。料金はマットPP込みで部数により異なる（公式の料金表で確認）。締切は表紙・本文とも通常の締切の2営業日前。表紙印刷のみの受付は不可。フェア期間は予告なく変わる場合あり。申し込みがないと利用不可、前入金制、特急入稿は不可。
