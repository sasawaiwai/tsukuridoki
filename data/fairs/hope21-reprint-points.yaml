conditions_text: 前回発注の納品希望日から再入稿日まで3か月以内。前回データそのままで10%、1ページのみ変更で5%、4ページ以内の変更で3%（通常2%）。5ページ以上の変更は対象外。豆本・スーパークイックセット・グッズを除く全セット。見積もりNaviで「再版特典」を選び前回の商品IDを入力。のせのせ（カスタム印刷）・早割・早得・オンリーイベント支援と併用可（早得は30%まで）。
