conditions_text: スタンダードセット・文芸オンデセットなど対象セットのみ（A5・B6・新書・文庫まで、一部併用できないオプションあり）。カバー用紙は9種類、印刷はフルカラー・ピュアホワイト・ネオンピンク・シャインゴールド・ルミナスシルバーから選択。シープスキンはトレーシングペーパーより透けにくい。料金は公式の料金表で確認。締切は表紙・本文・カバーとも通常の締切の2営業日前。カバーのみの納品は不可。申し込みがないと利用不可、前入金制、特急入稿は不可。
