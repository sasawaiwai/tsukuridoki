conditions_text: 冊子1種につきどちらか1つ（併用不可）。対象会場は東京ビッグサイト・インテックス大阪。大判ポスターはB1以下（壁配置はA0まで）、入稿〆切はイベントごと（例：12/13合わせはA0が11/25(水)・B1以下が12/1(火)正午、1/10合わせはA0が12/22(火)・B1以下が12/26(土)正午。冊子の〆切とは別）。ポスタースタンドの予約〆切もイベントごと（12/13合わせ12/4(金)〜1/10合わせ12/29(火)正午）。対象はスタンダードコースのセット（カラーセット・色刷表紙セット・小説本セット・オールカラーセット・A4オールカラーセット・コミックスパック・上製本セット・オールカラー上製本セット・ふんわりモンテシオンセット・プレミアム箔押し×トポラスFセット）とカスタムコース。他社表紙持込は不可。新刊と一括で会場に直接搬入する場合のみ。自己申告制（予約時に申請）。
