summary: 入稿〆切表で決められた早めの締切までに入稿すると、ぱっくの基本料金が割引になる。自宅宅配・店頭引取は10%引、優遇イベント合わせ（会場への搬入）は20%引・10%引の締切がある。
benefit_summary: 早めの入稿でぱっく基本料金が10%引（優遇イベント合わせは最大20%引）
source_type: official_campaign
benefit_types:
  - discount
specific_sets_only: true
conditions_text: 割引はぱっくの基本料金のみで、オプションは対象外。早割の欄があるのは締切表に載っているぱっく（本文オフセット・オンデマンド1色刷の本、まるごとクラフトぱっく、フルカラーの本など。グッズには早割なしのものがある）。締切日はぱっく・ページ数・納品方法ごとに公式の入稿〆切表で確認。オプションによって締切が早まる。早期割引はキャンペーンに含まれない（キャンペーンの併用制限の対象外）。
