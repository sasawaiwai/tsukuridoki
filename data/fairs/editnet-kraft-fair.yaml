conditions_text: オンデマンドお試しプランの特別割引として提供。表紙は指定のクラフト紙（未晒クラフト・D'CRAFT・クラフトリプロライナー）にオンデマンド白1色、本文はオンデマンド黒1色（2色印刷への変更は別料金）。無線綴じのみ。A5・B5（文庫・新書まで小さいサイズも可）。白の面積が全体の50%を超える場合は加算額が必要になることがある。入稿期限はイベント前週の木曜20時（前々週なら割引あり。大きなイベントの前などは異なる）で、期限後はこのフェアを扱わない。ページに記載のない割引は対象外。料金は公式で確認。
