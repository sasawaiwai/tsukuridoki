conditions_text: 表紙はNPホワイト200kg（PP加工なし）のスミ刷り、本文は上質紙・淡クリームキンマリ。無線綴じのみ（中綴じ不可）。カバー（クリアPP・マットPP・クラフト・トレペ）や遊び紙は有料オプション。早期入稿で30%・20%・10%オフ。ピックアップイベント・とらのあな・メロンブックスへの直接納品は送料無料。早期入稿の割引はページ内に料金の記載があるものが対象で、それ以外のオプションは対象外。300ページ以上は締切が3営業日早まる。
