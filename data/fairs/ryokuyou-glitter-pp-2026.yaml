conditions_text: 加工対象は基本カラー表紙（ハイマッキンレーポスト）またはノスタルジー メランコリー230。対象はカラーセット・小説本セット（カラー表紙・A5のみ）・オールカラーセット。B5は背幅4mmまで（超える場合は別途見積）。本文16ページの場合は84kg未満の本文用紙は不可。カバーへの加工は不可。〆切は表紙+6営業日。料金は部数により異なる（公式の価格表で確認）。自己申告制（予約時に申請）。
