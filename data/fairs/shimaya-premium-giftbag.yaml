conditions_text: スタンダードセット・文芸オンデセットなど対象セットと同時の注文のみ（バッグだけの注文、本の冊数を超える注文、分納は不可）。バッグは幅170×マチ85×高さ230mm（A5より大きい本は入らない。ビデオテープ・DVDケース入りのセットも対象）。印刷なしの箔押しのみ（横70×縦90mm以内）。料金は部数・仕様により異なる（公式の料金表で確認）。締切は表紙・本文それぞれ通常の締切の7営業日前（繁忙期は変更あり）。注文時にその他のオプションから選択。前入金制。
