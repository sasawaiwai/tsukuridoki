conditions_text: オンデ表紙セット・オンデマンドセット 極匠・文芸オンデセットなど対象セットのみ（各プレミアムも対象。文芸カラーカバーセットなどは表紙のみ）。表紙印刷は対象セットに準じる（オンデマンドフルカラー・スミ・単色）。紙の風合いを生かすため表紙にPP加工は付かない（パルルックはPP加工が必須）。一部の用紙は在庫限り。料金は用紙の種類・部数により異なる（公式の料金表で確認）。締切は対象セットの通常の締切。備考欄に希望の紙名を記入。表紙のみの納品は不可。申し込みがないと利用不可、前入金制、特急入稿は不可。
