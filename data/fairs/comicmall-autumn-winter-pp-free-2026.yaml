conditions_text: 発注時にPPを選び、備考欄に【秋冬PP加工無料フェア】と書く。対象は基本セットのPP加工可能な表紙用紙、カバー（コート・マシュマロ・しこくてんれい白・サーブル）、オプション表紙用紙。平日午前11時までの入稿で翌週の同じ曜日に納品（祝日・年末年始の納期は公式で確認）。終了日は公式の表記に月の記載がないため公式で確認（2027年3月23日からは春夏PP加工無料フェア）。
