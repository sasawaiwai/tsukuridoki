conditions_text: |-
  発注時にPPを選び、備考欄に【秋冬PP加工無料フェア】と書く。
  対象は基本セットのPP加工可能な表紙用紙、カバー（コート・マシュマロ・しこくてんれい白・サーブル）、オプション表紙用紙。
  平日午前11時までの入稿で翌週の同じ曜日に納品（祝日・年末年始の納期は公式で確認）。
  終了日は公式の表記（2027月22日）に月の記載がないが、2027年3月23日から春夏PP加工無料フェアが始まるため、3月22日（春分の日の振替休日）までと判断。
