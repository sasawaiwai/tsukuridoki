conditions_text: 冊子印刷を5000円以上（オプション・送料を除く基本料金）注文する場合に、グッズ特典（グッズシングル・ダブル・ダブルsp）、ポイント特典（シングル・ダブル）、冊子特典（60冊以上で＋10冊）から1点。1冊・5冊の注文は不可（10冊から）。イベント支援特典とは併用可、期間限定フェアとは併用不可（一部を除く）。大きなイベントの特別スケジュール期間は使えない場合がある。締切は公式の〆切スケジュールで確認。
