conditions_text: |-
  チンドンベリィパック・コース2が対象。
  表紙はオフメタル165kg金か銀で、オンデマンドフルカラー印刷（通常の4色・白を先刷りした5色・マゼンタを蛍光ピンクに差し替えた4色から選ぶ）、クリアPPかマットPP付き。
  水曜入稿（朝10時まで）で、入稿から4営業日後に発送。
  備考欄に「ギンパラフェア」と書き、発注後に専用フォームで装丁を送る。
  用紙在庫がなくなった時点で終了。
  紙の性質上、印刷方向に擦り傷が入る。
