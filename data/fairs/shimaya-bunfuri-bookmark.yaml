conditions_text: 文学フリマに搬入がある人のみ（ほかのイベントは不可）。対象は文芸オンデセット・文芸オンデカラーカバーセット・文芸ベーシックセット・文芸カラー表紙セット・文芸カラーカバーセット・ラノベセット（文芸ステープルは対象外）。しおりは表紙（カバーセットは中の表紙）と同じ紙・印刷で片面のみ、本と同梱で納品。締切は各セットの表紙の締切まで。発注書・備考欄に「文学フリマフェア オリジナルしおり希望」と記入（記入がないと利用不可）。申し込み後の変更は不可。前入金制。
