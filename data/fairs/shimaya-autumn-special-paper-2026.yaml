conditions_text: オンデ表紙セット・オンデマンドセット 極匠・文芸オンデセットなど対象セットのみ（各プレミアムも対象。文芸カラーカバーセットなどは表紙のみ）。かぐや 新月・ICHIMATSU クリアブラックは金・銀・ピュアホワイトの単色印刷を推奨、ほかの4種はオンデマンドフルカラー・スミ・単色。紙の風合いを生かすため表紙にPP加工は付かない。かぐやは凹凸が深く色抜けしやすい。料金は用紙ごとに異なる（公式の料金表で確認）。締切は各セットの表紙の締切まで（白おさえなどを追加すると早まる場合あり）。紙の在庫により受付終了の可能性あり。申し込みがないと利用不可、前入金制、特急入稿は不可。
