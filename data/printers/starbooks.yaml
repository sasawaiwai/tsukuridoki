# 割引制度・イベント支援・ポスター割は本体サイト（www）にあり、トップ・フッターからリンクされている（2026-10-20確認）
watch_urls:
  - https://www.starbooks.jp/doujin/discount_system.php
  - https://www.starbooks.jp/eventguide/support/
  - https://www.starbooks.jp/goods/bigposter/
# blog.starbooks.jp も starbooks.jp に含まれる
domains: [starbooks.jp]
# リンクはトップページ固定（運営方針）
link_policy: top_page_only
crawl_policy: allowed
terms_url: null
policy_note: "自動アクセスの明示的な禁止を確認できず、robots.txt上も対象ページは禁止されていないため、低頻度巡回の対象とする（許諾を得たものではない）。robots.txtは www は全体を許可、blog は /wp-admin/ のみ禁止。利用規約・リンクポリシーのページは見当たらず（2026-10-20確認）。"
crawl_interval_days: 7
last_policy_checked_at: 2026-10-20
