printer_id: starbooks
# 運営は株式会社明光社（会社概要は blog.starbooks.jp/company/。2026-10-20確認）
name: STARBOOKS
official_url: https://www.starbooks.jp/
# フェア・キャンペーンはブログの「フェア」カテゴリに記事として並ぶ（新しい順。1ページ6件、古い回は2ページ目以降）
fair_index_url: https://blog.starbooks.jp/category/faire/
# 一覧の記事カードからだけリンクを拾う（サイドバーのリンクを避ける）
fair_link_selector: section.category-page .card a
# 割引制度・イベント支援・ポスター割は本体サイト（www）にあり、トップ・フッターからリンクされている（2026-10-20確認）
watch_urls:
  - https://www.starbooks.jp/doujin/discount_system.php
  - https://www.starbooks.jp/eventguide/support/
  - https://www.starbooks.jp/goods/bigposter/
# blog.starbooks.jp も starbooks.jp に含まれる
domains: [starbooks.jp]
# リンクはトップページ固定（運営方針）
link_policy: top_page_only
# 2026-10-21 運営者決定：Actions からの巡回で robots.txt が HTTP 403（www・blog とも）のため自動巡回しない。手元など別の接続元からの自動巡回もしない
crawl_policy: manual_only
terms_url: null
policy_note: "自動アクセスの明示的な禁止は確認できなかったが、GitHub Actions からのアクセスで robots.txt が HTTP 403（2026-10-20）。サーバーが自動アクセスを拒否したものとして扱い、manual_only とする（人が通常のブラウザで公式情報を確認する）。robots.txtは www は全体を許可、blog は /wp-admin/ のみ禁止。利用規約・リンクポリシーのページは見当たらず（2026-10-20確認）。"
crawl_interval_days: 7
last_policy_checked_at: 2026-10-20
