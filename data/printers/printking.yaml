  - https://printking.co.jp/doujin/campaign/betsu_mitsu_fes.php
domains: [printking.co.jp]
# リンクはトップページ固定（運営方針）
link_policy: top_page_only
crawl_policy: allowed
terms_url: https://printking.co.jp/doujin/shotorihiki/indexriyoukiyaku.php
policy_note: "自動アクセスの明示的な禁止を確認できず、robots.txtも無いため、低頻度巡回の対象とする（許諾を得たものではない）。利用規約第1条4に「本サービスの掲載内容の全部または一部を無断で転載・複写・蓄積・転送・引用・改変するなど、著作権法違反として刑事責任を問われる可能性を有する行為」をしない旨の定めがある。運営者の判断（2026-10-15）：著作権で保護される文章の転載と、客観的な事実情報の収集・整理を区別して扱い、登録を続ける。条件は、本文を保存・転載・複製しない（仕様書7-2）、開催期間・割引率・対象商品・適用条件などの事実だけを独自の表現で掲載する、公式URLを出典として示す。規約に情報収集・二次利用を明示的に禁止する定めが別に見つかったら、登録を保留して報告する。"
crawl_interval_days: 7
last_policy_checked_at: 2026-10-15
