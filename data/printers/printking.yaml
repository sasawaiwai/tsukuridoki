official_url: https://printking.co.jp/doujin/
# 「キャンペーンについて」。キャンペーンが1ページに並ぶ（#cam番号）。2026-10-15確認
fair_index_url: https://printking.co.jp/doujin/campaign/index.php
crawl_selector: '#mainContent'
# 一覧のリンクは用紙・会社案内などで、キャンペーンの個別ページではないため、たどらない
