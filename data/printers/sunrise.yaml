# リンクはトップページ固定（運営方針）
link_policy: top_page_only
crawl_policy: allowed
terms_url: null
policy_note: "自動アクセスの明示的な禁止を確認できず、robots.txt上も対象ページは禁止されていないため、低頻度巡回の対象とする（許諾を得たものではない）。robots.txtは /cgi-bin/ のみ禁止（MJ12bot・AhrefsBot は全体を禁止）。利用規約のページは見当たらず（2026-11-10確認）。"
crawl_interval_days: 7
