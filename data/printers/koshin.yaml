policy_note: "自動アクセスの明示的な禁止を確認できず、robots.txtも無いため、低頻度巡回の対象とする（許諾を得たものではない）。トップから利用規約のページは見当たらず（2026-10-18確認）。"
crawl_interval_days: 7
last_policy_checked_at: 2026-10-18
